<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Mentorship & Student Support System for Nitte Meenakshi Institute of Technology. Streamlining student support across academic, hostel, and administrative categories." />
    <title>Nitte Smart Mentorship & Student Support System</title>
    <!-- Fonts & Icons for Stitch UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              nitte: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#2e3192',
                900: '#1e2269',
                950: '#131543',
              },
              surface: {
                card: '#ffffff',
                subtle: '#f8fafc',
                border: '#e2e8f0',
                highlight: '#f1f5f9'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03)',
              'card-hover': '0 10px 25px -3px rgba(46, 49, 146, 0.08), 0 4px 6px -2px rgba(46, 49, 146, 0.04)',
              'elevated': '0 20px 30px -10px rgba(46, 49, 146, 0.12), 0 10px 10px -5px rgba(46, 49, 146, 0.04)',
              'pill-glow': '0 0 15px rgba(46, 49, 146, 0.25)',
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
